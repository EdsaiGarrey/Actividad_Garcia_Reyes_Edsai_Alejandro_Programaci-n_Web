<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- Permite que se adapte a celulares, tablets y PC -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ejercicio 18 - Manipulación del DOM</title>

    <!-- Bootstrap desde internet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="CSS/ejercicio18.css">
</head>
<body>

    <main class="container py-5">
        <section class="card shadow-lg mx-auto contenedor">
            <div class="card-body p-4">

                <h1 class="text-center mb-3">Lista Dinámica</h1>

                <p class="text-center text-muted">
                    Agrega y elimina elementos usando manipulación del DOM con JavaScript.
                </p>

                <!-- Mensaje de error -->
                <div id="mensaje"></div>

                <!-- Formulario -->
                <div class="input-group mb-4">
                    <input 
                        type="text" 
                        id="nuevoElemento" 
                        class="form-control" 
                        placeholder="Escribe un elemento"
                    >

                    <button 
                        id="agregarBtn" 
                        class="btn btn-primary" 
                        type="button"
                    >
                        Agregar
                    </button>
                </div>

                <h2 class="h5 mb-3">Elementos agregados</h2>

                <!-- Lista dinámica -->
                <ul id="lista" class="list-group"></ul>

            </div>
        </section>
    </main>

    <!-- JavaScript propio -->
    <script src="JS/ejercicio18.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
