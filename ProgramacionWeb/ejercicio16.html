<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- Hace que la página se adapte a celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ejercicio 16 - Calculadora</title>

    <!-- CSS del ejercicio -->
    <link rel="stylesheet" href="CSS/ejercicio16.css">

    <!-- SweetAlert2 para mensajes de error -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <main class="contenedor">
        <h1>Calculadora de Números</h1>

        <p>
            Operaciones básicas usando funciones flecha en JavaScript.
        </p>

        <form>
            <!-- Primer número -->
            <label for="numero1">Primer número:</label>
            <input type="text" id="numero1" placeholder="Ejemplo: 10">

            <!-- Segundo número -->
            <label for="numero2">Segundo número:</label>
            <input type="text" id="numero2" placeholder="Ejemplo: 5">

            <!-- Botones de operaciones -->
            <div class="botones">
                <button type="button" onclick="calcularOperacion('suma')">Sumar</button>
                <button type="button" onclick="calcularOperacion('resta')">Restar</button>
                <button type="button" onclick="calcularOperacion('multiplicacion')">Multiplicar</button>
                <button type="button" onclick="calcularOperacion('division')">Dividir</button>
            </div>

            <!-- Resultado solo lectura -->
            <label for="resultado">Resultado:</label>
            <input type="text" id="resultado" readonly placeholder="Aquí aparecerá el resultado">
        </form>
    </main>

    <!-- JavaScript del ejercicio -->
    <script src="JS/ejercicio16.js"></script>
</body>
</html>
