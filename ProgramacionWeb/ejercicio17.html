<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- Permite adaptar el diseño a celulares, tablets y PC -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ejercicio 17 - Gestión de Tareas</title>

    <!-- CSS del ejercicio -->
    <link rel="stylesheet" href="CSS/ejercicio17.css">

    <!-- SweetAlert2 para alertas y confirmaciones -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <main class="contenedor">
        <h1>Gestión de Tareas</h1>

        <p>
            Agrega, visualiza y elimina tareas usando JSON, Local Storage, funciones, closures y scope.
        </p>

        <section class="formulario">
            <!-- Campo para escribir la tarea -->
            <label for="tareaInput">Nueva tarea:</label>
            <input type="text" id="tareaInput" placeholder="Ejemplo: Estudiar JavaScript">

            <!-- Botón para agregar tarea -->
            <button type="button" onclick="agregarTarea()">Agregar Tarea</button>
        </section>

        <section class="lista">
            <h2>Tareas pendientes</h2>

            <!-- Aquí se mostrarán las tareas -->
            <ul id="listaTareas"></ul>
        </section>
    </main>

    <!-- JavaScript del ejercicio -->
    <script src="JS/ejercicio17.js"></script>
</body>
</html>
