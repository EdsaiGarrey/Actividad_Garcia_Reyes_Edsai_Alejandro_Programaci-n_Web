<!-- Ejercicio 7 explicacion de block y inline -->
<!DOCTYPE html>
<html>
<head>
    <title>Ejercicio 7 - Block y Inline</title>
</head>
<body>
    <!-- 1. Elementos Block -->
    <div style="background-color: lightblue;">
        Este es un elemento block.
    </div>
    <p style="background-color: lightgreen;">
        Este es otro elemento block.
    </p>

    <!-- 2. Elementos Inline -->
    <span style="background-color: lightyellow;">
        Este es un elemento inline.
    </span>
    <a href="#" style="background-color: lightcoral;">
        Este es otro elemento inline.
    </a>

    <!-- 3. Combinación de block e inline -->
    <div style="background-color: lightpink;">
        Este es un block con
        <span style="background-color: lightcyan;">
            texto inline
        </span>
        dentro.
    </div>
</body>
</html>
