<!DOCTYPE html>
<html>
<head>

    <title>Ejercicio 6</title>
</head>
<body>

    <!-- 1. ¿Qué es un div? -->
    <div>
        <h1>Titulo</h1>
        <p>Parrafo</p>
        <!-- Enlace y botón en la MISMA línea para que no se separen -->
        <a href="#">Enlace</a> <button>Boton</button>
        <!-- La imagen la dejamos como estaba -->
        <img src="" alt="">
    </div>

    <!-- 2. Múltiples div -->
    <div>
        <!-- 3. ¿Cuándo se debe usar? -->
        <!-- Se recomienda usar div para: Agrupar elementos relacionados, aplicar estilos, crear layouts, etc. -->
    </div>

    <!-- 4. Ejemplos prácticos -->
    <div>
        <div>
            <h2>Sección 1</h2>
            <p>Contenido de la sección 1</p>
        </div>
        <div>
            <h2>Sección 2</h2>
            <p>Contenido de la sección 2</p>
        </div>
    </div>

</body>
